[project]
name = "agile"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "f90nml>=1.4.5",
    "fortdepend>=2.3.2",
    "fypp>=3.2",
]

[project.optional-dependencies]
docs = [
    "ford>=7.0",
]
analysis = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "scipy>=1.12",
    "imageio-ffmpeg>=0.5",
]
# Editor tooling. fortls is the Fortran language server the VS Code extension
# drives for go-to-definition, hover and the outline; see .vscode/settings.json
# and tools/vscode/fypp-fortran/.
ide = [
    "fortls>=3.2",
]
