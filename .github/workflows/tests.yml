name: tests (CPU)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        type: choice
        options: [ basic, extended, all ]
        default: basic
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    - cron: '0 2 * * 0'   # weekly full run on master (Sunday 02:00 UTC)

# Basic suite by default; the full suite for the weekly run, for a PR labelled
# 'full-tests', or as chosen in a manual run. Read by tests/Makefile.
env:
  SUITE: >-
    ${{ inputs.suite
        || (github.event_name == 'schedule' && 'all')
        || (contains(github.event.pull_request.labels.*.name, 'full-tests') && 'all')
        || 'basic' }}

jobs:
  GNU:
    # labelling a PR reruns CI only for the full-tests label
    if: github.event.action != 'labeled' || github.event.label.name == 'full-tests'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        FC_compiler: [gfortran-14]
        CC_compiler: [gcc-14]
        include:
          - os: macos-latest
            FC_compiler: gfortran-15
            CC_compiler: gcc-15

    env:
      CC: ${{ matrix.CC_compiler }}
      FC: ${{ matrix.FC_compiler }}
      AGILE_DIR: ${{ github.workspace }}
      OSX_GCC_PACKAGE_NAME: gcc@15
      
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} / ${{ matrix.FC_compiler }}

    steps:
      - uses: actions/checkout@v6
      - name: install dependencies
        run: |
          if [[ $RUNNER_OS == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install ${{ matrix.FC_compiler }}
            sudo apt-get install openmpi-bin libopenmpi-dev
          else
            brew install ${{ env.OSX_GCC_PACKAGE_NAME }}
            brew install open-mpi
            brew install grep
            brew install md5sha1sum
            ln -s $(which ${{ matrix.FC_compiler }}) /usr/local/bin/gfortran
            
          fi
      - name: check compiler versions
        run: |
          ${FC} --version
          ${CC} --version
          mpirun --version
      - name: create Python environment
        run: |
          pip install uv
          uv sync
      - name: compile and run tests
        run: |
          cd tests
          arch=gnu ./test_runner.sh

  INTEL:
    # labelling a PR reruns CI only for the full-tests label
    if: github.event.action != 'labeled' || github.event.label.name == 'full-tests'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ifx

    env:
      FC: ifx
      CC: icc
      AGILE_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6
      - name: setup for Intel oneAPI
        # see https://www.intel.com/content/www/us/en/develop/documentation/installation-guide-for-intel-oneapi-toolkits-linux
        run: |
          wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          rm GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo add-apt-repository  -y "deb https://apt.repos.intel.com/oneapi all main"
      - name: install Intel oneAPI
        run: |
          sudo apt update 
          sudo apt-get install intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic
          sudo apt-get install intel-oneapi-compiler-fortran
          sudo apt-get install intel-oneapi-mpi
          sudo apt-get install intel-oneapi-mpi-devel
          source /opt/intel/oneapi/setvars.sh
          printenv >> $GITHUB_ENV
      - name: check compiler versions
        run: |
          ${FC} --version
          mpirun --version
          mpiifx --version
      - name: create Python environment
        run: |
          pip install uv
          uv sync
      - name: compile
        run: |
          cd tests
          arch=ifx ./test_runner.sh
